<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directory & Attendance Portal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📂</text></svg>">
  <!-- Chart.js for Attendance Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-card: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --folder-bg: #1e293b;
      --folder-border: #38bdf8;
      --folder-tab: #0284c7;
      --success-bg: rgba(34, 197, 94, 0.15);
      --success-border: #22c55e;
      --success-text: #4ade80;
      --danger: #f43f5e;
      --border: #334155;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 2rem 1.5rem; min-height: 100vh; }
    .container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 2rem; }

    /* HEADER BAR */
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; display: flex; align-items: center; gap: 0.6rem; color: #ffffff; }
    .header-btns { display: flex; gap: 0.75rem; }

    /* BUTTONS */
    .btn { background: var(--primary); color: #0f172a; padding: 0.65rem 1.25rem; border-radius: 10px; border: none; font-weight: 700; font-size: 0.875rem; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); display: inline-flex; align-items: center; gap: 0.4rem; text-decoration: none; }
    .btn:hover { background: #7dd3fc; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3); }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--surface-card); border-color: var(--muted); transform: translateY(-1px); box-shadow: none; }
    .btn-danger { background: rgba(244, 63, 94, 0.15); color: var(--danger); border: 1px solid rgba(244, 63, 94, 0.3); }
    .btn-danger:hover { background: var(--danger); color: white; }
    .btn-sm { padding: 0.35rem 0.7rem; font-size: 0.8rem; border-radius: 6px; }

    /* FOLDERS GRID */
    .folders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.75rem; }

    .folder-card {
      background: var(--folder-bg);
      border: 1px solid var(--border);
      border-top: 4px solid var(--folder-border);
      border-radius: var(--radius);
      padding: 1.5rem;
      position: relative;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 170px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .folder-card:hover { transform: translateY(-4px); border-color: var(--primary); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4); }

    .folder-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .folder-title { font-size: 1.25rem; font-weight: 700; color: #ffffff; word-break: break-word; }
    .folder-badge { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.2); color: var(--primary); padding: 0.25rem 0.65rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }

    .folder-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 1.25rem; border-top: 1px dashed var(--border); padding-top: 0.85rem; }
    .folder-actions { display: flex; gap: 0.35rem; }

    /* VIEW INSIDE FOLDER (AGENT LIST) */
    .folder-view { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 2rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); }
    .folder-view-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1.25rem; flex-wrap: wrap; gap: 1rem; }

    /* DATE PICKER BAR */
    .date-picker-box { display: flex; align-items: center; gap: 0.5rem; background: var(--bg); padding: 0.4rem 0.75rem; border-radius: 10px; border: 1px solid var(--border); }
    .date-picker-box input[type="date"] { background: transparent; border: none; color: var(--primary); font-weight: 700; font-size: 0.9rem; cursor: pointer; padding: 0; width: auto; }
    .date-picker-box input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }

    /* INLINE AGENT ADD FIELD */
    .quick-add-bar { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; background: var(--bg); padding: 0.75rem; border-radius: 12px; border: 1px solid var(--border); }
    .quick-add-bar input { flex: 1; background: transparent; border: none; outline: none; color: white; font-size: 0.95rem; padding: 0.25rem 0.5rem; }

    .agent-row { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.25rem; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 0.65rem; background: var(--bg); transition: all 0.2s; }
    .agent-row:hover { border-color: var(--muted); }

    /* ATTENDED TOGGLE PILL */
    .attendance-toggle { display: flex; align-items: center; cursor: pointer; user-select: none; }
    .attendance-toggle input { display: none; }
    .toggle-pill {
      padding: 0.45rem 0.9rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      background: var(--surface-card);
      color: var(--muted);
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }
    .attendance-toggle input:checked + .toggle-pill {
      background: var(--success-bg);
      color: var(--success-text);
      border-color: var(--success-border);
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.2);
    }

    /* CHART CONTAINER */
    .chart-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      position: relative;
      height: 260px;
    }

    /* MODALS */
    .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 1rem; }
    .modal { background: var(--surface); width: 100%; max-width: 850px; border-radius: var(--radius); padding: 2rem; border: 1px solid var(--border); max-height: 85vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--muted); }
    .modal-close:hover { color: white; }

    /* FORM STYLES */
    .form-group { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.25rem; }
    .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--muted); }
    input, select { padding: 0.75rem; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: white; font-size: 0.95rem; width: 100%; outline: none; }
    input:focus, select:focus { border-color: var(--primary); }

    /* TABLES */
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.85rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- HEADER BAR -->
    <header>
      <h1>📁 Offices & Directory</h1>
      <div class="header-btns">
        <button class="btn btn-secondary" onclick="openModal('attendance-modal')">📊 See Attendance Data</button>
        <button class="btn" onclick="openModal('office-modal')">➕ New Office</button>
      </div>
    </header>

    <!-- MAIN HOME VIEW: OFFICE FOLDERS GRID -->
    <main id="home-view">
      <h2 style="margin-bottom: 1.25rem; color: var(--muted); font-size: 0.95rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">Select an Office Folder:</h2>
      <div class="folders-grid" id="folders-container">
        <!-- Dynamic Folders Rendered Here -->
      </div>
    </main>

    <!-- FOLDER DETAIL VIEW (Inside an Office) -->
    <main id="folder-view" class="folder-view hidden">
      <div class="folder-view-header">
        <div>
          <button class="btn btn-secondary btn-sm" onclick="showHomeView()">← Back to Folders</button>
          <h2 id="active-folder-title" style="margin-top: 0.75rem; font-size: 1.6rem;">Office Name</h2>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 0.25rem;">
          <span style="font-size: 0.8rem; color: var(--muted);">Attendance Date</span>
          <div class="date-picker-box">
            📅 <input type="date" id="selected-attendance-date" onchange="changeAttendanceDate(this.value)">
          </div>
        </div>
      </div>

      <!-- INLINE AGENT ADD FORM -->
      <form id="inline-agent-form" class="quick-add-bar" onsubmit="handleInlineAddAgent(event)">
        <input type="text" id="inline-agent-name" placeholder="Type new agent full name here..." required>
        <button type="submit" class="btn btn-sm">➕ Add Agent to this Office</button>
      </form>

      <h3 style="font-size: 0.9rem; color: var(--muted); margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em;">Assigned Agents</h3>
      <div id="agents-list-container">
        <!-- Dynamic Agents Rendered Here -->
      </div>
    </main>

  </div>

  <!-- MODAL: ADD / EDIT OFFICE -->
  <div class="modal-overlay" id="office-modal">
    <div class="modal" style="max-width: 500px;">
      <div class="modal-header">
        <h2 id="office-modal-title">Create Office</h2>
        <button class="modal-close" onclick="closeModal('office-modal')">&times;</button>
      </div>
      <form id="office-form">
        <input type="hidden" id="office-id">
        <div class="form-group">
          <label for="office-name">Office Name</label>
          <input type="text" id="office-name" placeholder="e.g. Bellevue HQ" required>
        </div>
        <button type="submit" class="btn" style="width: 100%; justify-content: center;">Save Office</button>
      </form>
    </div>
  </div>

  <!-- MODAL: HISTORICAL ATTENDANCE DATA & ANALYTICS -->
  <div class="modal-overlay" id="attendance-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>📊 Attendance Analytics & History</h2>
        <button class="modal-close" onclick="closeModal('attendance-modal')">&times;</button>
      </div>

      <!-- Filters -->
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 1.25rem;">
        <div>
          <label style="font-size: 0.8rem; font-weight: 600; color: var(--muted);">Year</label>
          <select id="filter-year" onchange="loadAttendanceLogs()">
            <!-- Dynamically Populated -->
          </select>
        </div>
        <div>
          <label style="font-size: 0.8rem; font-weight: 600; color: var(--muted);">Month</label>
          <select id="filter-month" onchange="loadAttendanceLogs()">
            <option value="">All Months</option>
            <option value="01">January</option>
            <option value="02">February</option>
            <option value="03">March</option>
            <option value="04">April</option>
            <option value="05">May</option>
            <option value="06">June</option>
            <option value="07">July</option>
            <option value="08">August</option>
            <option value="09">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>
        </div>
        <div>
          <label style="font-size: 0.8rem; font-weight: 600; color: var(--muted);">Office</label>
          <select id="filter-office" onchange="loadAttendanceLogs()">
            <option value="">All Offices</option>
          </select>
        </div>
      </div>

      <!-- VISUAL GRAPH CONTAINER -->
      <div class="chart-box">
        <canvas id="attendanceChart"></canvas>
      </div>

      <!-- Logs Table -->
      <h3 style="font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">Detailed Attendance Records</h3>
      <table>
        <thead>
          <tr>
            <th>Agent Name</th>
            <th>Office</th>
            <th>Date Attended</th>
            <th style="text-align: right;">Action</th>
          </tr>
        </thead>
        <tbody id="attendance-logs-body">
          <tr><td colspan="4" style="text-align:center;">Loading logs...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const API_URL = "https://attendance-api.gstillwindermerebss.workers.dev/api";

    let globalOffices = [];
    let globalAgents = [];
    let activeLogs = new Set();
    let currentOfficeId = null;
    let attendanceChart = null;

    // Selected Date defaults to today's date YYYY-MM-DD
    let selectedDateStr = new Date().toISOString().split('T')[0];

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("selected-attendance-date").value = selectedDateStr;
      initData();
    });

    async function initData() {
      await loadAttendanceForSelectedDate();
      await loadOffices();
      await loadAgents();
    }

    // --- DATA FETCHING ---
    async function loadAttendanceForSelectedDate() {
      try {
        const [year, month] = selectedDateStr.split('-');
        const res = await fetch(`${API_URL}/attendance?year=${year}&month=${month}`);
        const logs = await res.json();
        if (Array.isArray(logs)) {
          activeLogs = new Set(logs.filter(l => l.date === selectedDateStr).map(l => l.agent_id));
        } else {
          activeLogs.clear();
        }
      } catch (e) {
        console.error("Error loading attendance for selected date", e);
        activeLogs.clear();
      }
    }

    async function changeAttendanceDate(newDate) {
      if (!newDate) return;
      selectedDateStr = newDate;
      await loadAttendanceForSelectedDate();
      renderFolders();
      if (currentOfficeId) openFolder(currentOfficeId);
    }

    async function loadOffices() {
      try {
        const res = await fetch(`${API_URL}/offices`);
        const data = await res.json();
        if (!Array.isArray(data)) return;

        globalOffices = data;
        renderFolders();
        populateOfficeDropdowns();
      } catch (e) { console.error(e); }
    }

    async function loadAgents() {
      try {
        const res = await fetch(`${API_URL}/agents`);
        const data = await res.json();
        if (!Array.isArray(data)) return;

        globalAgents = data;
        renderFolders();
        if (currentOfficeId) openFolder(currentOfficeId);
      } catch (e) { console.error(e); }
    }

    // --- RENDER FOLDERS GRID ---
    function renderFolders() {
      const container = document.getElementById("folders-container");
      if (globalOffices.length === 0) {
        container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--muted); padding: 3rem;">No offices created yet. Click <strong>➕ New Office</strong> to start.</div>`;
        return;
      }

      container.innerHTML = globalOffices.map(o => {
        const officeAgents = globalAgents.filter(a => a.office_id === o.id);
        const attendedCount = officeAgents.filter(a => activeLogs.has(a.id)).length;

        return `
          <div class="folder-card" onclick="openFolder(${o.id})">
            <div>
              <div class="folder-header">
                <div class="folder-title">📁 ${escape(o.office_name)}</div>
                <span class="folder-badge">${officeAgents.length} Agents</span>
              </div>
            </div>
            <div class="folder-footer">
              <span style="font-size: 0.8rem; font-weight: 600; color: var(--success-text);">
                ${attendedCount}/${officeAgents.length} Attended
              </span>
              <div class="folder-actions" onclick="event.stopPropagation()">
                <button class="btn btn-secondary btn-sm" onclick="editOffice(${o.id}, '${escape(o.office_name)}')">✏️</button>
                <button class="btn btn-danger btn-sm" onclick="deleteOffice(${o.id})">🗑️</button>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    // --- INSIDE FOLDER VIEW ---
    function openFolder(officeId) {
      currentOfficeId = officeId;
      const office = globalOffices.find(o => o.id === officeId);
      if (!office) return;

      document.getElementById("active-folder-title").innerText = `📁 ${office.office_name}`;
      document.getElementById("home-view").classList.add("hidden");
      document.getElementById("folder-view").classList.remove("hidden");

      const officeAgents = globalAgents.filter(a => a.office_id === officeId);
      const container = document.getElementById("agents-list-container");

      if (officeAgents.length === 0) {
        container.innerHTML = `<p style="color: var(--muted); text-align: center; padding: 2rem;">No agents in this folder. Use the field above to add one!</p>`;
        return;
      }

      container.innerHTML = officeAgents.map(a => {
        const isAttended = activeLogs.has(a.id);
        return `
          <div class="agent-row">
            <div>
              <strong style="color: white; font-size: 0.95rem;">${escape(a.agent_name)}</strong>
            </div>
            <div style="display: flex; align-items: center; gap: 0.75rem;">
              <label class="attendance-toggle">
                <input type="checkbox" ${isAttended ? 'checked' : ''} onchange="toggleAttendance(${a.id}, '${escape(a.agent_name)}', ${office.id}, '${escape(office.office_name)}', this.checked)">
                <span class="toggle-pill">${isAttended ? '✓ Attended' : '+ Mark Present'}</span>
              </label>
              <button class="btn btn-secondary btn-sm" onclick="editAgentInline(${a.id}, '${escape(a.agent_name)}')">✏️</button>
              <button class="btn btn-danger btn-sm" onclick="deleteAgent(${a.id})">🗑️</button>
            </div>
          </div>
        `;
      }).join("");
    }

    function showHomeView() {
      currentOfficeId = null;
      document.getElementById("folder-view").classList.add("hidden");
      document.getElementById("home-view").classList.remove("hidden");
      renderFolders();
    }

    // --- INLINE ADD AGENT TO OPEN FOLDER ---
    async function handleInlineAddAgent(e) {
      e.preventDefault();
      const input = document.getElementById("inline-agent-name");
      const agent_name = input.value.trim();

      if (!agent_name || !currentOfficeId) return;

      await fetch(`${API_URL}/agents`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ agent_name, office_id: currentOfficeId })
      });

      input.value = "";
      await loadAgents();
    }

    async function editAgentInline(id, currentName) {
      const agent_name = prompt("Update Agent Name:", currentName);
      if (agent_name && agent_name !== currentName) {
        await fetch(`${API_URL}/agents/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ agent_name, office_id: currentOfficeId })
        });
        await loadAgents();
      }
    }

    // --- ATTENDANCE TOGGLE LOGIC ---
    async function toggleAttendance(agentId, agentName, officeId, officeName, isChecked) {
      if (isChecked) activeLogs.add(agentId);
      else activeLogs.delete(agentId);

      openFolder(officeId);

      await fetch(`${API_URL}/attendance`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          agent_id: agentId,
          agent_name: agentName,
          office_id: officeId,
          office_name: officeName,
          date: selectedDateStr,
          attended: isChecked
        })
      });
    }

    // --- HISTORICAL ATTENDANCE LOGS & GRAPH RENDER ---
    async function loadAttendanceLogs() {
      const yearSelect = document.getElementById("filter-year");
      const monthSelect = document.getElementById("filter-month");
      const officeSelect = document.getElementById("filter-office");

      const year = yearSelect.value;
      const month = monthSelect.value;
      const office_id = officeSelect.value;

      const params = new URLSearchParams();
      if (year) params.append("year", year);
      if (month) params.append("month", month);
      if (office_id) params.append("office_id", office_id);

      try {
        const res = await fetch(`${API_URL}/attendance?${params.toString()}`);
        const logs = await res.json();

        const tbody = document.getElementById("attendance-logs-body");
        
        if (!Array.isArray(logs) || logs.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color: var(--muted); padding: 2rem;">No logs found for the selected filters.</td></tr>`;
          renderGraph([], year, month);
          return;
        }

        tbody.innerHTML = logs.map(l => `
          <tr>
            <td><strong>${escape(l.agent_name)}</strong></td>
            <td>${escape(l.office_name)}</td>
            <td style="color: var(--primary); font-weight: 600;">${l.date}</td>
            <td style="text-align: right;">
              <button class="btn btn-danger btn-sm" title="Delete Log" onclick="removeAttendanceLog(${l.agent_id}, '${l.date}', ${l.office_id})">🗑️ Delete</button>
            </td>
          </tr>
        `).join("");

        renderGraph(logs, year, month);

      } catch (err) {
        console.error("Failed to fetch attendance logs:", err);
      }
    }

    // --- RENDER DYNAMIC CHART ---
    function renderGraph(logs, selectedYear, selectedMonth) {
      const ctx = document.getElementById('attendanceChart').getContext('2d');
      let labels = [];
      let counts = [];

      if (!selectedMonth) {
        // Group by Month when "All Months" is selected
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        labels = monthNames;
        counts = new Array(12).fill(0);

        logs.forEach(log => {
          const mIndex = parseInt(log.date.split('-')[1], 10) - 1;
          if (mIndex >= 0 && mIndex < 12) counts[mIndex]++;
        });
      } else {
        // Group by Day of the Month when a specific Month is selected
        const daysInMonth = new Date(selectedYear || new Date().getFullYear(), parseInt(selectedMonth, 10), 0).getDate();
        labels = Array.from({ length: daysInMonth }, (_, i) => `${i + 1}`);
        counts = new Array(daysInMonth).fill(0);

        logs.forEach(log => {
          const dayIndex = parseInt(log.date.split('-')[2], 10) - 1;
          if (dayIndex >= 0 && dayIndex < daysInMonth) counts[dayIndex]++;
        });
      }

      if (attendanceChart) {
        attendanceChart.destroy();
      }

      attendanceChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: selectedMonth ? 'Daily Attendance' : 'Monthly Attendance',
            data: counts,
            backgroundColor: '#38bdf8',
            borderColor: '#0284c7',
            borderWidth: 1,
            borderRadius: 6,
            hoverBackgroundColor: '#7dd3fc'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#1e293b',
              titleColor: '#f8fafc',
              bodyColor: '#38bdf8',
              borderColor: '#334155',
              borderWidth: 1
            }
          },
          scales: {
            x: {
              grid: { display: false },
              ticks: { color: '#94a3b8', font: { family: 'Plus Jakarta Sans', size: 11 } }
            },
            y: {
              beginAtZero: true,
              ticks: { precision: 0, color: '#94a3b8', font: { family: 'Plus Jakarta Sans', size: 11 } },
              grid: { color: '#334155' }
            }
          }
        }
      });
    }

    async function removeAttendanceLog(agentId, date, officeId) {
      if (confirm(`Remove attendance record for this date (${date})?`)) {
        await fetch(`${API_URL}/attendance`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            agent_id: agentId,
            date: date,
            office_id: officeId,
            attended: false
          })
        });

        // If removing for currently selected date view, sync UI state
        if (date === selectedDateStr) {
          activeLogs.delete(agentId);
          renderFolders();
          if (currentOfficeId) openFolder(currentOfficeId);
        }

        loadAttendanceLogs();
      }
    }

    // --- OFFICE ACTIONS ---
    document.getElementById("office-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("office-id").value;
      const office_name = document.getElementById("office-name").value.trim();

      const method = id ? "PUT" : "POST";
      const url = id ? `${API_URL}/offices/${id}` : `${API_URL}/offices`;

      await fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ office_name })
      });

      closeModal("office-modal");
      initData();
    });

    function editOffice(id, name) {
      document.getElementById("office-id").value = id;
      document.getElementById("office-name").value = name;
      document.getElementById("office-modal-title").innerText = "Edit Office";
      openModal("office-modal");
    }

    async function deleteOffice(id) {
      if (confirm("Delete this office and all associated agents?")) {
        await fetch(`${API_URL}/offices/${id}`, { method: "DELETE" });
        if (currentOfficeId === id) showHomeView();
        initData();
      }
    }

    async function deleteAgent(id) {
      if (confirm("Delete this agent?")) {
        await fetch(`${API_URL}/agents/${id}`, { method: "DELETE" });
        initData();
      }
    }

    // --- MODAL UTILS ---
    function openModal(id) {
      if (id === 'attendance-modal') {
        const currentYear = new Date().getFullYear();
        const yearSelect = document.getElementById("filter-year");

        // Dynamically build year options down to 2025
        let yearOptions = `<option value="">All Years</option>`;
        for (let y = currentYear; y >= 2025; y--) {
          yearOptions += `<option value="${y}" ${y === currentYear ? 'selected' : ''}>${y}</option>`;
        }
        yearSelect.innerHTML = yearOptions;

        loadAttendanceLogs();
      }
      document.getElementById(id).style.display = "flex";
    }

    function closeModal(id) {
      document.getElementById(id).style.display = "none";
      if (id === 'office-modal') {
        document.getElementById("office-id").value = "";
        document.getElementById("office-name").value = "";
      }
    }

    function populateOfficeDropdowns() {
      const select = document.getElementById("filter-office");
      select.innerHTML = `<option value="">All Offices</option>` + 
        globalOffices.map(o => `<option value="${o.id}">${escape(o.office_name)}</option>`).join("");
    }

    function escape(str) {
      return str ? str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])) : '';
    }
  </script>
</body>
</html>
