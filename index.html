<script>
  // Config object is now populated dynamically from data.json
  let CONFIG = {
    SHARED_PASSWORD: "officepass123",
    GITHUB_OWNER: "",
    GITHUB_REPO: "",
    GITHUB_TOKEN: "",
    FILE_PATH: "data.json"
  };

  const DEFAULT_DATA = {
    offices: [{ id: "off_1", name: "Downtown Office" }],
    agents: [{ id: "ag_1", officeId: "off_1", name: "Alice Johnson" }],
    attendance: []
  };

  let appData = { ...DEFAULT_DATA };
  let fileSha = "";
  let currentOfficeId = null;

  // --- PRE-LOAD CONFIG FROM DATA.JSON ---
  window.addEventListener("DOMContentLoaded", async () => {
    try {
      // Fetch data.json static file with cache-busting timestamp
      const resp = await fetch(`data.json?t=${Date.now()}`);
      if (resp.ok) {
        const fileContent = await resp.json();
        if (fileContent.config) {
          CONFIG.SHARED_PASSWORD = fileContent.config.password || CONFIG.SHARED_PASSWORD;
          CONFIG.GITHUB_OWNER = fileContent.config.owner || "";
          CONFIG.GITHUB_REPO = fileContent.config.repo || "";
          CONFIG.GITHUB_TOKEN = fileContent.config.token || "";
        }
      }
    } catch (e) {
      console.log("Could not load initial config from data.json");
    }
  });

  // --- GITHUB REST API ENGINE ---
  async function fetchFromGitHub() {
    updateSyncState(true, "Fetching data...");
    
    // Fallback if config isn't populated
    if (!CONFIG.GITHUB_TOKEN) {
      updateSyncState(false, "No API Token Set");
      return false;
    }

    const url = `https://api.github.com/repos/${CONFIG.GITHUB_OWNER}/${CONFIG.GITHUB_REPO}/contents/${CONFIG.FILE_PATH}`;

    try {
      const resp = await fetch(url, {
        headers: {
          "Authorization": `token ${CONFIG.GITHUB_TOKEN}`,
          "Accept": "application/vnd.github.v3+json",
          "Cache-Control": "no-cache"
        }
      });

      if (resp.ok) {
        const fileData = await resp.json();
        fileSha = fileData.sha;
        
        const decodedContent = decodeURIComponent(escape(atob(fileData.content.replace(/\n/g, ''))));
        const parsed = JSON.parse(decodedContent);
        
        // Preserve current credentials while updating roster/attendance
        appData = parsed;
        updateSyncState(false, "Synced");
        return true;
      } else {
        updateSyncState(false, "Sync Error");
        return false;
      }
    } catch (err) {
      console.error("GitHub Fetch Error:", err);
      updateSyncState(false, "Offline");
      return false;
    }
  }

  async function commitToGitHub() {
    updateSyncState(true, "Saving to GitHub...");

    if (!CONFIG.GITHUB_TOKEN) {
      updateSyncState(false, "No API Token Set");
      return;
    }

    // Always preserve config object when saving
    appData.config = {
      password: CONFIG.SHARED_PASSWORD,
      owner: CONFIG.GITHUB_OWNER,
      repo: CONFIG.GITHUB_REPO,
      token: CONFIG.GITHUB_TOKEN
    };

    const url = `https://api.github.com/repos/${CONFIG.GITHUB_OWNER}/${CONFIG.GITHUB_REPO}/contents/${CONFIG.FILE_PATH}`;

    try {
      const jsonString = JSON.stringify(appData, null, 2);
      const contentBase64 = btoa(unescape(encodeURIComponent(jsonString)));

      const body = {
        message: "Update attendance data via Web App",
        content: contentBase64
      };

      if (fileSha) body.sha = fileSha;

      const resp = await fetch(url, {
        method: "PUT",
        headers: {
          "Authorization": `token ${CONFIG.GITHUB_TOKEN}`,
          "Content-Type": "application/json",
          "Accept": "application/vnd.github.v3+json"
        },
        body: JSON.stringify(body)
      });

      if (resp.ok) {
        const resData = await resp.json();
        fileSha = resData.content.sha;
        updateSyncState(false, "Saved to GitHub");
      } else {
        updateSyncState(false, "Save Failed");
      }
    } catch (err) {
      console.error("GitHub Save Error:", err);
      updateSyncState(false, "Network Error");
    }
  }

  function updateSyncState(isSyncing, text) {
    const spinner = document.getElementById("sync-spinner");
    const syncText = document.getElementById("sync-text");
    if (spinner && syncText) {
      if (isSyncing) spinner.classList.remove("hidden");
      else spinner.classList.add("hidden");
      syncText.innerText = text;
    }
  }

  // --- AUTHENTICATION ---
  async function handleLogin(e) {
    e.preventDefault();
    const pass = document.getElementById("auth-password").value;

    if (pass === CONFIG.SHARED_PASSWORD) {
      document.getElementById("login-btn").innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Loading Data...`;
      
      await fetchFromGitHub();

      document.getElementById("auth-screen").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      initDateBadgesAndFilters();
      showView("offices-view");
    } else {
      document.getElementById("auth-error").classList.remove("hidden");
    }
  }

  function logout() {
    document.getElementById("auth-screen").classList.remove("hidden");
    document.getElementById("app").classList.add("hidden");
    document.getElementById("auth-password").value = "";
    document.getElementById("login-btn").innerHTML = `<span>Unlock Portal</span>`;
  }

  // --- NAVIGATION & VIEWS ---
  function showView(viewId) {
    document.getElementById("offices-view").classList.add("hidden");
    document.getElementById("office-detail-view").classList.add("hidden");
    document.getElementById("reports-view").classList.add("hidden");

    document.getElementById(viewId).classList.remove("hidden");

    if (viewId === "offices-view") renderOffices();
    if (viewId === "reports-view") renderReports();
  }

  // --- DATE HELPERS ---
  function getTodayString() {
    return new Date().toISOString().split("T")[0];
  }

  function initDateBadgesAndFilters() {
    const todayStr = getTodayString();
    document.getElementById("current-date-badge").innerText = todayStr;

    const monthSelect = document.getElementById("filter-month");
    const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    monthSelect.innerHTML = months.map((m, idx) => `<option value="${idx}">${m}</option>`).join("");
    monthSelect.value = new Date().getMonth();

    const yearSelect = document.getElementById("filter-year");
    const currentYear = new Date().getFullYear();
    let yearsHtml = "";
    for (let y = currentYear - 2; y <= currentYear + 1; y++) {
      yearsHtml += `<option value="${y}" ${y === currentYear ? 'selected' : ''}>${y}</option>`;
    }
    yearSelect.innerHTML = yearsHtml;
  }

  // --- OFFICE MANAGEMENT ---
  function renderOffices() {
    const grid = document.getElementById("offices-grid");
    const filterOfficeSelect = document.getElementById("filter-office");
    grid.innerHTML = "";

    let filterOptions = `<option value="ALL">All Offices</option>`;

    (appData.offices || []).forEach(office => {
      filterOptions += `<option value="${office.id}">${office.name}</option>`;
      const agentCount = (appData.agents || []).filter(a => a.officeId === office.id).length;
      const todayStr = getTodayString();
      const attendedToday = (appData.attendance || []).filter(att => att.officeId === office.id && att.date === todayStr).length;

      const card = document.createElement("div");
      card.className = "bg-white rounded-xl shadow-md border border-slate-200 p-6 flex flex-col justify-between hover:shadow-lg transition";
      card.innerHTML = `
        <div>
          <div class="flex justify-between items-start mb-4">
            <h3 class="font-bold text-xl text-slate-800 cursor-pointer hover:text-indigo-600" onclick="openOfficeDetail('${office.id}')">${office.name}</h3>
            <div class="flex space-x-2">
              <button onclick="openOfficeModal('${office.id}')" class="text-slate-400 hover:text-indigo-600 p-1"><i class="fa-solid fa-pen"></i></button>
              <button onclick="deleteOffice('${office.id}')" class="text-slate-400 hover:text-red-600 p-1"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
          <p class="text-sm text-slate-500 mb-2"><i class="fa-solid fa-users mr-1"></i> ${agentCount} Agents registered</p>
          <p class="text-sm font-medium text-emerald-600"><i class="fa-solid fa-circle-check mr-1"></i> ${attendedToday} Attended Today</p>
        </div>
        <button onclick="openOfficeDetail('${office.id}')" class="mt-6 w-full bg-slate-100 hover:bg-indigo-50 text-indigo-700 font-semibold py-2 rounded-lg transition text-sm">
          Select Office &rarr;
        </button>
      `;
      grid.appendChild(card);
    });

    filterOfficeSelect.innerHTML = filterOptions;
  }

  function openOfficeModal(id = null) {
    document.getElementById("office-id").value = id || "";
    document.getElementById("office-name").value = id ? appData.offices.find(o => o.id === id).name : "";
    document.getElementById("office-modal-title").innerText = id ? "Edit Office" : "Add Office";
    document.getElementById("office-modal").classList.remove("hidden");
  }

  async function saveOffice() {
    const id = document.getElementById("office-id").value;
    const name = document.getElementById("office-name").value.trim();
    if (!name) return;

    if (!appData.offices) appData.offices = [];

    if (id) {
      const off = appData.offices.find(o => o.id === id);
      if (off) off.name = name;
    } else {
      appData.offices.push({ id: "off_" + Date.now(), name });
    }

    closeModal("office-modal");
    renderOffices();
    await commitToGitHub();
  }

  async function deleteOffice(id) {
    if (confirm("Are you sure? This will remove all associated agents and attendance history.")) {
      appData.offices = appData.offices.filter(o => o.id !== id);
      appData.agents = appData.agents.filter(a => a.officeId !== id);
      appData.attendance = appData.attendance.filter(a => a.officeId !== id);
      renderOffices();
      await commitToGitHub();
    }
  }

  // --- AGENTS & DAILY ATTENDANCE ---
  function openOfficeDetail(officeId) {
    currentOfficeId = officeId;
    const office = appData.offices.find(o => o.id === officeId);
    document.getElementById("selected-office-title").innerText = office ? office.name : "Office";
    showView("office-detail-view");
    renderAgents();
  }

  function renderAgents() {
    const list = document.getElementById("agents-list");
    list.innerHTML = "";

    const officeAgents = (appData.agents || []).filter(a => a.officeId === currentOfficeId);
    const todayStr = getTodayString();

    if (officeAgents.length === 0) {
      list.innerHTML = `<div class="p-8 text-center text-slate-400">No agents added to this office yet.</div>`;
      return;
    }

    officeAgents.forEach(agent => {
      const isAttended = (appData.attendance || []).some(att => att.agentId === agent.id && att.date === todayStr);

      const item = document.createElement("div");
      item.className = "p-4 flex items-center justify-between hover:bg-slate-50 transition";
      item.innerHTML = `
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center font-bold text-slate-600">
            ${agent.name.charAt(0)}
          </div>
          <div>
            <h4 class="font-semibold text-slate-800">${agent.name}</h4>
            <span class="text-xs ${isAttended ? 'text-emerald-600 font-semibold' : 'text-slate-400'}">
              ${isAttended ? 'Present Today' : 'Not marked present'}
            </span>
          </div>
        </div>

        <div class="flex items-center space-x-3">
          <button onclick="toggleAttendance('${agent.id}')" 
            class="px-4 py-2 rounded-lg font-medium text-sm transition shadow-sm ${
              isAttended 
                ? 'bg-emerald-100 text-emerald-800 border border-emerald-300 hover:bg-emerald-200' 
                : 'bg-indigo-600 hover:bg-indigo-700 text-white'
            }">
            <i class="fa-solid ${isAttended ? 'fa-check-circle' : 'fa-user-check'} mr-1.5"></i>
            ${isAttended ? 'Attended Today' : 'Mark Attended'}
          </button>
          <button onclick="openAgentModal('${agent.id}')" class="text-slate-400 hover:text-indigo-600 p-2"><i class="fa-solid fa-pen"></i></button>
          <button onclick="deleteAgent('${agent.id}')" class="text-slate-400 hover:text-red-600 p-2"><i class="fa-solid fa-trash"></i></button>
        </div>
      `;
      list.appendChild(item);
    });
  }

  async function toggleAttendance(agentId) {
    if (!appData.attendance) appData.attendance = [];
    const todayStr = getTodayString();
    const existingIdx = appData.attendance.findIndex(att => att.agentId === agentId && att.date === todayStr);

    if (existingIdx > -1) {
      appData.attendance.splice(existingIdx, 1);
    } else {
      appData.attendance.push({
        id: "att_" + Date.now(),
        agentId: agentId,
        officeId: currentOfficeId,
        date: todayStr
      });
    }

    renderAgents();
    await commitToGitHub();
  }

  function openAgentModal(id = null) {
    document.getElementById("agent-id").value = id || "";
    document.getElementById("agent-name").value = id ? appData.agents.find(a => a.id === id).name : "";
    document.getElementById("agent-modal-title").innerText = id ? "Edit Agent" : "Add Agent";
    document.getElementById("agent-modal").classList.remove("hidden");
  }

  async function saveAgent() {
    const id = document.getElementById("agent-id").value;
    const name = document.getElementById("agent-name").value.trim();
    if (!name) return;

    if (!appData.agents) appData.agents = [];

    if (id) {
      const ag = appData.agents.find(a => a.id === id);
      if (ag) ag.name = name;
    } else {
      appData.agents.push({
        id: "ag_" + Date.now(),
        officeId: currentOfficeId,
        name
      });
    }

    closeModal("agent-modal");
    renderAgents();
    await commitToGitHub();
  }

  async function deleteAgent(id) {
    if (confirm("Delete this agent and their attendance history?")) {
      appData.agents = appData.agents.filter(a => a.id !== id);
      appData.attendance = appData.attendance.filter(a => a.agentId !== id);
      renderAgents();
      await commitToGitHub();
    }
  }

  // --- REPORTS & FILTERING ---
  function renderReports() {
    const officeFilter = document.getElementById("filter-office").value;
    const monthFilter = parseInt(document.getElementById("filter-month").value);
    const yearFilter = parseInt(document.getElementById("filter-year").value);

    const tableBody = document.getElementById("reports-table-body");
    tableBody.innerHTML = "";

    const filteredRecords = (appData.attendance || []).filter(record => {
      const recDate = new Date(record.date + "T00:00:00");
      const matchesOffice = officeFilter === "ALL" || record.officeId === officeFilter;
      const matchesMonth = recDate.getMonth() === monthFilter;
      const matchesYear = recDate.getFullYear() === yearFilter;
      return matchesOffice && matchesMonth && matchesYear;
    });

    if (filteredRecords.length === 0) {
      tableBody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-slate-400">No attendance data found for selected filters.</td></tr>`;
      return;
    }

    filteredRecords.sort((a, b) => new Date(b.date) - new Date(a.date));

    filteredRecords.forEach(record => {
      const agent = (appData.agents || []).find(a => a.id === record.agentId) || { name: "Deleted Agent" };
      const office = (appData.offices || []).find(o => o.id === record.officeId) || { name: "Deleted Office" };

      const tr = document.createElement("tr");
      tr.className = "hover:bg-slate-50 transition";
      tr.innerHTML = `
        <td class="p-4 font-medium text-slate-800">${record.date}</td>
        <td class="p-4">${agent.name}</td>
        <td class="p-4">${office.name}</td>
        <td class="p-4 text-center">
          <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">
            Attended
          </span>
        </td>
      `;
      tableBody.appendChild(tr);
    });
  }

  function exportJSONData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", "data.json");
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  }

  function closeModal(modalId) {
    document.getElementById(modalId).classList.add("hidden");
  }
</script>
